<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9ec6e8" />
    <title>Senblox</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec6e8; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; padding: 6px 8px; border-radius: 6px; background: rgba(8,12,20,.62); color: #dfe9f5; white-space: pre; pointer-events: none; }
      #invite { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; padding: 8px 12px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; font: inherit; font-weight: 600; }
      #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 6px 10px; border-radius: 6px; background: rgba(8,12,20,.62); color: #dfe9f5; pointer-events: none; text-align: center; }
      #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12); display: none; pointer-events: none; }
      #knob { position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.55); }
      #jump { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.2); color: #fff; font: 700 14px ui-monospace, monospace; display: none; }
      body.touch #jump { display: block; }
      body.touch #hint { display: none; }
      #report { position: fixed; inset: 8% 5%; padding: 12px; border-radius: 10px; background: rgba(8,12,20,.94); color: #dfe9f5; display: none; flex-direction: column; gap: 8px; }
      #report textarea { flex: 1; width: 100%; background: #0b1220; color: #cfe3ff; border: 1px solid #28344d; border-radius: 6px; padding: 8px; font: 11px/1.3 ui-monospace, monospace; }
      #report button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; font: inherit; font-weight: 600; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; background: #9ec6e8; color: #0b2540; font: 600 16px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="status">Connexion…</div>
    <div id="hud"></div>
    <button id="invite">Copier le lien</button>
    <div id="hint">ZQSD/WASD ou flèches : bouger · Espace : sauter · Q/E : tourner · clic : souris</div>
    <div id="joy"><div id="knob"></div></div>
    <button id="jump">SAUT</button>
    <div id="report">
      <strong>Rapport de benchmark (H1)</strong>
      <textarea id="reportText" readonly></textarea>
      <div style="display:flex; gap:8px"><button id="copyReport">Copier</button><button id="closeReport">Fermer</button></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
