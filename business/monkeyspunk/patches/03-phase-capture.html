<!--
  PATCH 03 — Compteur de phase suivante + capture d'intérêt
  =========================================================

  PROBLÈME
  Le compteur visait le 1er septembre 2026. Depuis, il se remplace silencieusement
  par un bouton (comportement propre, mais la page n'a plus de date). Le trafic payant
  arrive sur une page sans échéance et sans aucune action possible : rien n'est capturé.

  SOLUTION
  1. Le compteur lit la prochaine phase on-chain au lieu d'une date codée en dur :
     il ne peut plus expirer sans que personne ne s'en aperçoive.
  2. Un formulaire de capture (e-mail ou wallet) remplace le mint quand aucune phase
     au prix annoncé n'est ouverte.

  DÉPENDANCE : poser le patch 01 d'abord — ce bloc réutilise sa fonction de lecture.
-->

<!-- ---------- 1. Compteur piloté par le contrat ---------- -->
<div id="count" data-next-phase>
  <span><b id="cj">--</b><small>jours</small></span>
  <span><b id="ch">--</b><small>heures</small></span>
  <span><b id="cm">--</b><small>min</small></span>
  <span><b id="cs">--</b><small>sec</small></span>
  <p id="count-label">Prochaine phase</p>
</div>

<script>
(function () {
  "use strict";
  var NFT  = "0xA2571Bf11a38dAB2a9829d0232eb83170E1bDD84";
  var RPCS = ["https://ethereum-rpc.publicnode.com", "https://eth.drpc.org"];

  function word(h, i) { return h.substr(2 + i * 64, 64); }
  function num(h, i)  { return BigInt("0x" + word(h, i)); }

  function call(data, i) {
    i = i || 0;
    return fetch(RPCS[i], {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call",
                             params: [{ to: NFT, data: data }, "latest"] })
    }).then(function (r) { return r.json(); })
      .then(function (j) { if (j.error) throw new Error(j.error.message); return j.result; })
      .catch(function (e) { if (i + 1 < RPCS.length) return call(data, i + 1); throw e; });
  }

  // Trouve la première phase dont l'ouverture est encore dans le futur.
  Promise.all([call("0xc68907de"), call("0xd637ed59")])
    .then(function (r) {
      var active = Number(BigInt(r[0]));
      var count  = Number(num(r[1], 1));
      if (active + 1 >= count) return null;     // plus aucune phase à venir
      return call("0x6f8934f4" + (active + 1).toString(16).padStart(64, "0"))
        .then(function (hex) {
          var base = Number(num(hex, 0)) / 32;
          return { start: Number(num(hex, base)) * 1000,
                   price: num(hex, base + 5),
                   id: active + 1 };
        });
    })
    .then(function (next) {
      var label = document.getElementById("count-label");
      if (!next) {
        if (label) label.textContent = "Toutes les phases sont ouvertes — voir le prix ci-dessous";
        return;
      }
      var eth = Number(next.price) / 1e18;
      if (label) {
        label.textContent = "Phase #" + next.id + " — " +
          (eth === 0 ? "gratuite" : eth + " ETH");
      }
      function tick() {
        var d = next.start - Date.now();
        if (d <= 0) { location.reload(); return; }   // la phase vient d'ouvrir
        var s = Math.floor(d / 1000);
        document.getElementById("cj").textContent = Math.floor(s / 86400);
        document.getElementById("ch").textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, "0");
        document.getElementById("cm").textContent = String(Math.floor(s % 3600 / 60)).padStart(2, "0");
        document.getElementById("cs").textContent = String(s % 60).padStart(2, "0");
      }
      tick(); setInterval(tick, 1000);
    })
    .catch(function () {
      var label = document.getElementById("count-label");
      if (label) label.textContent = "Calendrier annoncé sur Discord";
    });
})();
</script>

<!-- ---------- 2. Capture d'intérêt ---------- -->
<!--
  À placer dans la section #mint, visible quand le patch 01 passe en état « paused ».
  ACTION="" est volontairement vide : brancher sur le fournisseur déjà en place
  (Mailchimp, Brevo, Formspree, ou un endpoint maison). Ne PAS collecter sans base
  légale : la case de consentement ci-dessous est le minimum RGPD, et la politique
  de confidentialité du patch 04 doit exister avant la mise en ligne.
-->
<form id="phase-notify" class="notify" action="" method="post" hidden>
  <label for="notify-email">Être prévenu de l'ouverture de la prochaine phase</label>

  <div class="notify__row">
    <input type="email" id="notify-email" name="email" required
           autocomplete="email" placeholder="vous@exemple.com">
    <button type="submit" class="cta">Me prévenir</button>
  </div>

  <label class="notify__consent">
    <input type="checkbox" name="consent" required>
    J'accepte de recevoir un e-mail à l'ouverture de la prochaine phase de mint.
    Pas de revente de données, désinscription en un clic.
    <a href="/privacy" target="_blank" rel="noopener">Politique de confidentialité</a>
  </label>

  <p class="notify__status" role="status" aria-live="polite"></p>
</form>

<script>
(function () {
  "use strict";
  var form = document.getElementById("phase-notify");
  if (!form) return;

  // Affiché seulement si aucune phase au prix annoncé n'est ouverte (patch 01).
  var root = document.getElementById("mint-live");
  if (root) {
    new MutationObserver(function () {
      if (root.dataset.state === "paused" || root.dataset.state === "error") {
        form.hidden = false;
      }
    }).observe(root, { attributes: true, attributeFilter: ["data-state"] });
  }

  form.addEventListener("submit", function (e) {
    var status = form.querySelector(".notify__status");
    if (!form.getAttribute("action")) {
      e.preventDefault();
      status.textContent = "Formulaire non encore branché — configurez ACTION.";
      return;
    }
    status.textContent = "Envoi…";
  });
})();
</script>
